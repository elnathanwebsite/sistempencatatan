<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - ADGO</title>
  
  <style>
    /* Reset & Dasar Halaman Tema Putih */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    /* Kartu Utama */
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    /* Animasi Ikon Roda Gigi */
    .icon-box {
      font-size: 55px;
      margin-bottom: 20px;
      display: inline-block;
      animation: spin 5s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Judul & Teks */
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #0f172a;
      font-weight: 700;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .contact-info {
      font-size: 0.88rem;
      color: #475569;
      margin-bottom: 25px;
    }

    /* Pembungkus Tombol */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Style Tombol */
    .btn {
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      transform: translateY(-1px);
    }

    /* Notifikasi JavaScript */
    .status-message {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #059669;
      min-height: 20px;
    }

    /* Copyright ADGO */
    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ikon Roda Gigi Animasi -->
    <div class="icon-box">⚙️</div>
    
    <h1>Sedang Dalam Pemeliharaan</h1>
    <p>Kami sedang melakukan pembaruan sistem untuk memberikan layanan yang lebih baik. Mohon tunggu sebentar, kami akan segera kembali!</p>
    
    <p class="contact-info">Silakan hubungi kami developer untuk informasi lebih lanjut.</p>

    <!-- Tombol Interaktif & Hubungi Developer -->
    <div class="btn-group">
      <button class="btn btn-primary" onclick="checkStatus()">Cek Status</button>
      <!-- Ubah alamat email di bawah sesuai email developer kamu -->
      <a href="mailto:developer@adgo.com" class="btn btn-secondary">Hubungi Developer</a>
    </div>
    
    <!-- Tempat Pesan JS Muncul -->
    <div id="statusMessage" class="status-message"></div>
  </div>

  <!-- Copyright -->
  <footer>
    &copy; <span id="year"></span> ADGO. All rights reserved.
  </footer>

  <script>
    // Otomatis memperbarui tahun copyright
    document.getElementById("year").textContent = new Date().getFullYear();

    function checkStatus() {
      const messageElement = document.getElementById("statusMessage");
      messageElement.style.color = "#0284c7";
      messageElement.innerText = "Memeriksa status sistem...";
      
      setTimeout(() => {
        messageElement.style.color = "#059669";
        messageElement.innerText = "Sistem masih dalam perbaikan. Silakan muat ulang halaman secara berkala.";
      }, 1000);
    }
  </script>

</body>
</html>
